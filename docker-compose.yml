services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wika}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # go-whatsapp-web-multidevice (https://github.com/aldinokemal/go-whatsapp-web-multidevice)
  # Scan the QR from the app's Settings > Koneksi WhatsApp page after `up`.
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    restart: unless-stopped
    ports:
      - "${GOWA_PORT:-3001}:3000"
    environment:
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH:-admin:admin}
      WHATSAPP_WEBHOOK: http://api:3002/api/whatsapp/webhook
      WHATSAPP_WEBHOOK_SECRET: ${GOWA_WEBHOOK_SECRET:-change-me}
    volumes:
      - gowa_storages:/app/storages

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_NAME: ${APP_NAME:-artisancode-backend-ts}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      REST_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wika}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      DOKU_CLIENT_ID: ${DOKU_CLIENT_ID:-}
      DOKU_SHARED_KEY: ${DOKU_SHARED_KEY:-}
      API_BASE_URL: ${API_BASE_URL:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-gowa}
      GOWA_BASE_URL: http://gowa:3000
      GOWA_BASIC_AUTH: ${GOWA_BASIC_AUTH:-admin:admin}
      GOWA_DEVICE_ID: ${GOWA_DEVICE_ID:-}
      GOWA_WEBHOOK_SECRET: ${GOWA_WEBHOOK_SECRET:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BUN_PUBLIC_API_URL: ${BUN_PUBLIC_API_URL:-http://localhost:3002}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  gowa_storages:
